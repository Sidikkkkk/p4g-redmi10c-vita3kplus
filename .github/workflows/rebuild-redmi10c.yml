name: Rebuild P4G Vita3K-Plus (Redmi 10C Edition)

on:
  workflow_dispatch:
    inputs:
      title_id:
        description: 'Title ID P4G'
        required: true
        default: 'PCSE00120'
      build_mode:
        description: 'Mode Build'
        required: true
        default: 'fast_v133_redmi10c'

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Scripts
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install APKTool, NDK llvm-strip, Zipalign & Apksigner
        run: |
          sudo apt-get update
          sudo apt-get install -y wget curl jq python3-pip python3-pil zipalign apksigner ninja-build
          
          # Unduh Apktool secara stabil langsung dari GitHub Releases iBotPeaches
          APKTOOL_VER="2.11.0"
          wget -q https://github.com/iBotPeaches/Apktool/releases/download/v${APKTOOL_VER}/apktool_${APKTOOL_VER}.jar -O /usr/local/bin/apktool.jar
          wget -q https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -O /usr/local/bin/apktool
          chmod +x /usr/local/bin/apktool /usr/local/bin/apktool.jar

      - name: Download Latest Release from nckstwrt/Vita3K-Plus
        run: |
          echo "Mengambil APK rilis terbaru dari nckstwrt/Vita3K-Plus..."
          DL_URL=$(curl -s https://api.github.com/repos/nckstwrt/Vita3K-Plus/releases | jq -r '.[0].assets[] | select(.name | endswith(".apk")) | .browser_download_url' | head -n 1)
          if [ -z "$DL_URL" ] || [ "$DL_URL" = "null" ]; then
            DL_URL=$(curl -s https://api.github.com/repos/Vita3K/Vita3K-Android/releases | jq -r '.[0].assets[] | select(.name | endswith(".apk")) | .browser_download_url' | head -n 1)
          fi
          echo "Downloading: $DL_URL"
          wget -q "$DL_URL" -O base.apk

      - name: Decompile, Strip ELF Symbols (NDK llvm-strip) & Patch for Redmi 10C
        run: |
          apktool d base.apk -o decompiled -f

          # Hapus arsitektur selain arm64-v8a agar ukuran APK ramping
          find decompiled/lib -mindepth 1 -maxdepth 1 -type d ! -name "arm64-v8a" -exec rm -rf {} + || true

          # Strip simbol debug dari binary .so menggunakan NDK llvm-strip
          LLVM_STRIP=$(find /usr/local/lib/android/sdk/ndk -name "llvm-strip" | sort -V | tail -n 1)
          if [ -n "$LLVM_STRIP" ]; then
            echo "Menjalankan NDK llvm-strip pada libvita3k.so..."
            "$LLVM_STRIP" --strip-unneeded decompiled/lib/arm64-v8a/*.so || true
          fi

          python3 patch_apk_redmi10c.py "${{ github.event.inputs.title_id }}"
          apktool b decompiled --use-aapt2 -o unsigned.apk

      - name: 4KB Page-Align & Sign APK (V1+V2+V3)
        run: |
          keytool -genkey -v -keystore p4g-fog.keystore \
            -storepass p4gandroid -alias p4gfog -keypass p4gandroid \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Atlus, OU=Redmi10C, O=Atlus, L=Tokyo, S=Tokyo, C=JP"

          zipalign -v -p 4 unsigned.apk aligned.apk

          apksigner sign --ks p4g-fog.keystore \
            --ks-pass pass:p4gandroid \
            --key-pass pass:p4gandroid \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out Persona-4-Golden-Redmi10C.apk aligned.apk

      - name: Upload Redmi 10C Optimized APK
        uses: actions/upload-artifact@v4
        with:
          name: Persona-4-Golden-Redmi10C
          path: Persona-4-Golden-Redmi10C.apk
